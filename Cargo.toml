[package]
name = "chords-server-rs"
version = "0.1.0"
edition = "2021"

[features]
default = []
standalone = ["dep:rust-embed", "dep:mime_guess"]

[dependencies]
axum = "0.7"
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tower-http = { version = "0.5", features = ["cors"] }
midir = "0.9"
rodio = "0.18"
hound = "3.5"
rust-embed = { version = "8", optional = true }
mime_guess = { version = "2", optional = true }
