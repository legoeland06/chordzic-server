// Génération de liens pour l'aspect "Toile"
function make_links(links_to_use=[],nodes_to_use=uniqueNodes) {
    const ze_links = [];
    for(let i=0; i<nodes_to_use.length; i++) {
        // pas de doublons de liens entre les mêmes nœuds, et pas de lien d'un nœud à lui-même
        for(let j=0; j<nodes_to_use.length; j++) {
            // if (i === j) continue;
            // if (nodes_to_use[i].label === nodes_to_use[j].label) continue;
            // gestion des notes communes entre les nœuds : plus il y a de notes communes, plus le lien est épais et plus cyan, sinon plus fin et plus magenta
            let sharedNotes = nodes_to_use[i].notes.filter(note => nodes_to_use[j].notes.includes(note));
            ze_links.push({ source: nodes_to_use[i].id, target: nodes_to_use[j].id ,
                radius: (nodes_to_use[i].r + nodes_to_use[j].r)/2,group:nodes_to_use[i].group ,mode:nodes_to_use[i].mode,notes:sharedNotes });
            }
        }
        return ze_links;
    }

function trace_lines(source,target) {
    ctx.beginPath();
    ctx.moveTo(source.x, source.y);
    ctx.lineTo(target.x, target.y);
    ctx.stroke();
}

function draw(links_to_use=links,nodes_to_use=uniqueNodes) {
    ctx.clearRect(0, 0, width, height);
    const time = Date.now() * 0.0002;
    
    links_to_use.forEach(d => {
        const linkNotes=d.notes;

        const speed = (0.1 + (d.radius / 20 * 0.2));
        const pos = (time * speed) % 1;
        const px = d.source.x + (d.target.x - d.source.x) * pos;
        const py = d.source.y + (d.target.y - d.source.y) * pos;
        const distToSource = Math.sqrt(Math.pow(px-d.source.x, 2) + Math.pow(py-d.source.y, 2));
        const distToTarget = Math.sqrt(Math.pow(d.target.x-px, 2) + Math.pow(d.target.y-py, 2));
        
        // Dessin des liens
        // récupère la valeur de l'envergure globale du graphe 
        // (distance entre les nœuds les plus éloignés) pour normaliser la largeur des liens    
        const maxRadius = 300;
        const normalizedRadius = d.radius / maxRadius;
        
        if (linkNotes.length >= 3 ) {
            ctx.lineWidth = (Math.pow(d.radius*2+linkNotes.length/16.18,2) / 2000*coeff);
            ctx.strokeStyle = "rgba(200,50, "+String(250-linkNotes.length*2)+", "+String(0.5*coeff)+")";
            ctx.fillStyle = "rgba(200, 50, "+String(250-linkNotes.length*2)+", "+String(0.5*coeff)+")";
            trace_lines(d.source, d.target);
            
            // Particules de Flux (MPE Data Transfer simulation)
            if (!d.radius) d.radius = 10; // Valeur par défaut si radius n'est pas définive
            if (d.source.group === d.target.group) {
                // si la particule est plus proche de la source que de la cible, elle est plus rouge, sinon plus cyan
                if (distToSource < distToTarget) {
                    ctx.fillStyle = "rgba(0, 0, 255, 1)";
                } else {
                    ctx.fillStyle = "rgba(50, 255, 100, 1)";
                }
                ctx.beginPath();
                ctx.arc(px, py, d.radius / 10, 0, Math.PI * 2);
                ctx.fill();
                ctx.stroke();
            }
        }

        // Mise en subrillance des autres accords liés à la source sélectionnée
        if (selectedNode && d.source.id.split('|')[0] === selectedNode.id.split('|')[0] || d.source.id.split('|')[1] === selectedNode.id.split('|')[0]) {
            ctx.beginPath();
            ctx.strokeStyle = "rgba(0, 255, 0, 1)";
            if (linkNotes.length >2) {
                ctx.lineWidth = (Math.pow(linkNotes.length,4) / 30)
                trace_lines(d.source, d.target);
            } else if (linkNotes.length <= 2) {
                ctx.lineWidth = (Math.pow(linkNotes.length,2) / 30);
                trace_lines(d.source, d.target);
            }
            ctx.stroke();
            
            
            ctx.beginPath();
            ctx.fillStyle =  "rgba(0, 255, 255, 1)";
            ctx.strokeStyle = "rgba(0, 255, 255, 0.5)";
            ctx.arc(d.target.x, d.target.y, 3, 0, Math.PI * 2);
            ctx.fill();
            ctx.stroke();
            
        }
    });
    
    // Dessin des nœuds
    nodes_to_use.forEach(d => {
        ctx.beginPath();
        const grad = ctx.createRadialGradient(d.x, d.y, 0, d.x, d.y, d.r*.05);
        grad.addColorStop(0, "rgba("+String(79+d.r*4)+", "+String(120-d.r)+", "+String(100-d.r*3)+", .8)");
        grad.addColorStop(1, "transparent",1);
        ctx.fillStyle = grad;
        ctx.arc(d.x, d.y, d.r , 0, Math.PI * 2);
        ctx.fill();
        
        if (selectedNode && (d.id.split('|')[0] === selectedNode.id.split('|')[0] || d.id.split('|')[1] === selectedNode.id.split('|')[0])) {
            ctx.beginPath();
            ctx.strokeStyle = "rgba(255, 255, 255, 1)";
            ctx.lineWidth = 2;
            ctx.arc(d.x, d.y, d.r + 5, 0, Math.PI * 2);
            ctx.stroke();

            ctx.fillStyle = "rgba(255, 255, 255, 1)";
            ctx.font = "24px monospace" 
            // ctx.fillText(d.label, d.x + 5, d.y + 5);

        } else {
            ctx.beginPath();
            ctx.strokeStyle = "rgba(255, 255, 255, 0.5)";
            ctx.lineWidth = 1;
            ctx.stroke();

            ctx.fillStyle = "rgba(255, 255, 255, 0.5)";
            ctx.font = "14px monospace";
            ctx.fillText(d.label, d.x + 5, d.y + 5);
        }

    });
    requestAnimationFrame(() => draw(links_to_use,nodes_to_use));
}

// Mise en place d'une nouvelle liste de noeuds liés les uns aux autres 
// par le nombre de notes communes 7 noeuds seront choisis au hasard parmi 
// tous les noeuds.
function generateRandomSubgraph(links_to_use=links) {
    const firstPositionNode = Math.floor(Math.random() * uniqueNodes.length);

    // // augmentation du contenu par concaténations 
    // const multiNodes = Array.from({ length: n * uniqueNodes.length }, (_, i) => ({
        //     ...uniqueNodes[i % uniqueNodes.length]
        // }));
        // multiNodes.sort(() => Math.random() - 0.5);
        
        // // on réassigne tout ça vers le tableau uniqueNodes réinitialisé avec la nouvelle longueur
        
        const n = 3;
        const multiNodes = Array.from({ length: uniqueNodes.length * n }, (_, i) => {
            // On récupère l'élément d'origine (modulo la taille du tableau source)
            const original = uniqueNodes[i % uniqueNodes.length];
            
            return {
                ...original, // On copie toutes les propriétés (notes, group, r, etc.)
                id: `${original.id}_copy_${Math.floor(i / uniqueNodes.length)}`, // Nouvel ID unique
                notes: [...original.notes] // On clone aussi le tableau de notes pour éviter les références partagées
            };
        });
    uniqueNodes = [...multiNodes.values()];
        
    const selectedNodes = uniqueNodes.slice(firstPositionNode % uniqueNodes.length-1, (firstPositionNode + nbOfChords) % uniqueNodes.length-1);
    const filteredLinks = make_links(links_to_use,selectedNodes);

    console.log("Nœuds sélectionnés pour le sous-graphe :", selectedNodes.length);
    console.log("Liens filtrés pour le sous-graphe :", filteredLinks.length);

    return { nodes: selectedNodes, links: filteredLinks };
}

function playChord(node) {

    // Arrangement de l'ordre des notes pour que la fondamentale soit la plus basse,
    // et les autres notes arrangées en fonction de leur intervalle par rapport à la fondamentale
    // (ex: pour CM7 -> C4 , E4 , G4 , B4)
    // (ex: pour AM7 -> A4 , C#5 , E5 , G#5)

    const fundamental = node.notes[0];
    const fundamentalMidi = noteToMidi[fundamental];

    const sortedNotes = node.notes.map(note => {
        let midiValue = noteToMidi[note];
        if (midiValue < fundamentalMidi) {
            midiValue += 12;
        } else if (midiValue - fundamentalMidi > 12) { // Si l'intervalle est plus grand qu'une octave et une sixte, on ramène la note dans l'octave suivante pour éviter les notes trop aiguës
            midiValue -= 12;
        }
        return { note, midi: fundamentalMidi + 60+ midiValue };
    }).map(n => n.note + Math.floor((n.midi) / 18)); // Convertir le MIDI en notation avec octave (ex: C4, E4, G4, B4)

    // ici on ajoute au début de la séquence de notes la fondamentale deux octaves plus bas pour renforcer la perception de la tonalité (ex: pour CM7 -> C2 , C4 , E4 , G4 , B4)
    sortedNotes.unshift(fundamental + "2");


    // Appel au backend Flask via POST JSON
    fetch('/play', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ notes: sortedNotes })
    }).then(resp => resp.json())
    .then(data => console.log('Play response:', data))
    .catch(err => console.error('Play error:', err));
   
}

// Interaction basique
d3.select(canvas).call(d3.drag()
.container(canvas)
.subject(e => simulation.find(e.x, e.y))

.on("start", e => {
    if (!e.active) simulation.alphaTarget(0.3).restart();
    e.subject.fx = e.subject.x;
    e.subject.fy = e.subject.y;
    selectedNode = e.subject;
    playChord(selectedNode);
})
.on("drag", e => {
    e.subject.fx = e.x;
    e.subject.fy = e.y;
    selectedNode = e.subject;
})
.on("end", e => {
    if (!e.active) simulation.alphaTarget(0);
    e.subject.fx = null;
    e.subject.fy = null;
    selectedNode = e.subject;
})
);
